<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="img/logo_carniceria.png">
    <link rel="stylesheet" href="style.css">
    <title>Carnicería Lizz - Mi Perfil</title>
</head>
<body>

    <header>
        <div class="contenedor-header">
        <div class="marca">
            <a href="index.html">
            <img src="img/logo_carniceria.png" alt="Logo" width="80">
            </a>
        </div>
        
        <nav>
            <p>
                <a href="index.html">Inicio</a> 
                <a href="menu_prod.html">Menú de Productos</a> 
                <a href="sucursales.html">Sucursales</a> 
                <a href="recomendaciones.html">Recomendaciones</a>
                <a href="empresa.html">Conozcanos</a>
                <a href="login.html">Mi Perfil</a>
            </p>
        </nav>
        </div>
    </header>

    <main>
        <main class="contenedor-perfil">
    <section class="tarjeta-login">
        <h2>Ingresar a mi Cuenta</h2>
        <form action="#" method="POST">
            <div class="campo">
                <label>Correo Electrónico:</label>
                <input type="email" name="user_email" placeholder="ejemplo@correo.com" required>
            </div>

            <div class="campo">
                <label>Contraseña:</label>
                <input type="password" name="user_password" required>
            </div>

            <input type="submit" value="Entrar a mi Perfil" class="boton-rojo">
        </form>
    </section>

    <section class="tarjeta-login">
        <h2>Registro de Clientes</h2>
        <form action="#" method="POST">
            <div class="campo">
                <label>Nombre Completo:</label>
                <input type="text" name="nombre_completo" required>
            </div>

            <div class="campo">
                <label>Dirección de Entrega:</label>
                <input type="text" name="direccion_entrega" placeholder="Calle, número y colonia" required>
            </div>

            <input type="submit" value="Crear mi Cuenta" class="boton-rojo">
        </form>
    </section>
     </main>

    

</body>
</html>
